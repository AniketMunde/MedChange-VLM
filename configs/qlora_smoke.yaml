milestone: M7.2

model:
  name: Qwen/Qwen2.5-VL-3B-Instruct
  quantization: 4bit
  quant_type: nf4
  double_quant: true
  compute_dtype: float16

dataset:
  train: data/nih/qlora_smoke/train.jsonl
  validation: data/nih/qlora_smoke/validation.jsonl
  image_count_per_example: 2

lora:
  rank: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj

training:
  batch_size: 1
  gradient_accumulation_steps: 4
  max_steps: 20
  learning_rate: 0.0002
  warmup_ratio: 0.03
  gradient_checkpointing: true
  max_length: 2048

images:
  min_pixels: 50176
  max_pixels: 50176

output:
  directory: models/qlora/medchange_temporal_smoke