vlm:
  model_name: "Qwen/Qwen2.5-VL-3B-Instruct"

  quantization:
    enabled: true
    bits: 4
    quant_type: "nf4"
    double_quant: true
    compute_dtype: "float16"

  vision:
    min_visual_tokens: 256
    max_visual_tokens: 512

  generation:
    max_new_tokens: 512
    do_sample: false
    temperature: null
    top_p: null

  device:
    device_map: "auto"

  safety:
    trust_remote_code: false